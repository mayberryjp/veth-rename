# Firewalling is opt-in; omitted enabled also defaults to false.
enabled: false
# Evaluate policy and log WOULD_DROP, but permit all traffic when enabled.
audit_mode: false
# Host-veth directions: ingress = container -> network; egress = network -> container.
# The other direction still evaluates/logs policy but permits all traffic.
enforcement_direction: both
permit_all_icmp: true
manual_rules: manual.yaml
sando_rules: sando.yaml
# Base URL: sync requests GET /api/ignorelist. Set your actual Sando host/port.
sando_endpoint: "http://192.0.2.10:8000"
sando_direction: both
# endpoint: ignore a wildcard side when selecting rules for a container.
# all_matches: legacy assignment, where a wildcard side selects every veth.
sando_assignment: endpoint
# Opt in to background polling and live policy updates (no restart).
sando_poll: false
sando_poll_interval: 60s
drop_log: /var/log/veth-renamer/firewall-drops.log
