[Service]
# Install instead of ipfix.conf, then configure both YAML files.
ExecStart=
ExecStart=/usr/sbin/veth-manager --mode=primary-repair --mapping-file=/run/veth-manager/mappings.json --ipfix-config=/etc/veth-manager/ipfix.yaml --firewall-config=/etc/veth-manager/firewall.yaml
CapabilityBoundingSet=CAP_SYS_ADMIN CAP_NET_ADMIN CAP_SYS_PTRACE CAP_DAC_OVERRIDE CAP_BPF CAP_PERFMON
RestrictAddressFamilies=AF_UNIX AF_NETLINK AF_INET AF_INET6
LogsDirectory=veth-manager
LogsDirectoryMode=0750
